<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
        <title>Kian's Hobby Hub</title>
    </head>

    <body>
        <div class="container-fluid bg-primary text-white p-4">
            <h1>My Hobby Hub</h1>
            <p>A page about the things I love to do</p>
        </div>

        <div class="container">
            <div class="bg-success text-white p-3 my-3">
                <h2>Reading</h2>
                <p>I love reading adventure stories.</p>
            </div>

            <div class="bg-warning border border-dark p-3 my-3">
                <h2>Drawing</h2>
                <p>I enjoy drawing animals.</p>
            </div>

            <div class="bg-info text-white border border-dark p-3 my-3">
                <h2>Coding</h2>
                <p>I love building websites with HTML.</p>
            </div>

            <div class="bg-danger text-white p-3 my-3">
                <h2>Sports</h2>
                <p>I love playing soccer.</p>
            </div>

            <div class="bg-primary border border-dark p-3 my-3">
                <h2>Music</h2>
                <p>I love listening to music.</p>
            </div>
        </div>

        <div class="container-fluid bg-dark text-white p-3">
            <p>Made with Bootstrap — My Hobby Hub</p>
        </div>
    </body>
</html>
